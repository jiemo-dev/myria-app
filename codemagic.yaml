workflows:
  android-apk:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.24.5 
    scripts:
      - name: Build Android APK
        script: |
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk